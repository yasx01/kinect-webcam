name: Windows executable
on:
  workflow_dispatch:
  push:
    paths: ['windows/**', 'tests/windows/**', '.github/workflows/windows.yml', 'v15/kinect_facecam_media_v15.py']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            autoconf
            automake
            libtool
            make
            curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-libusb
      - name: Compile open-source camera libraries and firmware loader
        shell: msys2 {0}
        run: bash windows/build-native.sh
      - name: Build integrated Kinect driver installer
        shell: msys2 {0}
        run: bash windows/build-driver.sh
      - name: Install isolated runner dependencies
        shell: pwsh
        run: |
          python -m pip install -r windows/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
      - name: Test, package, and launch the Windows executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KinectWebcam-Windows-x64
          path: |
            dist/KinectWebcam-Windows-x64.zip
            dist/windows-selftest.json
            dist/windows-sha256.txt
          if-no-files-found: error
